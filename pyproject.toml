[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscale-investimenti-it"
version = "0.1.0"
description = "Fiscalità degli investimenti in Italia: redditi di capitale e diversi, 26% e 12,5%, zainetto fiscale con scadenze, piano di fine anno e tax-loss harvesting all'italiana"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Torraco" }]
keywords = ["tasse", "zainetto fiscale", "minusvalenze", "tax-loss harvesting", "regime amministrato", "Italia"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "plotly>=5.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
png = ["kaleido>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
fiscale-investimenti = "fiscale_investimenti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fiscale_investimenti = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
